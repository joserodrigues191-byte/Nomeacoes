<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nomeações da Banda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nomeações">
<meta name="theme-color" content="#04271d">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#04271d;--fg:#eef4f0;--mut:#9fbdaf;--card:#0a3a2b;--bd:#1a5942;--ac:#2a9d6a;--onac:#fff;--hi:#f08a7e;--lo:#e3b95a;--ok:#74d6a0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
nav button{flex:1;min-width:110px}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:var(--onac,#fff);border-color:var(--ac)}
button.del{color:var(--hi)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row>*{flex:1;min-width:120px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:4px;min-width:90px;position:relative}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ac)}
.tag{padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}
.hi{color:var(--hi)}.lo{color:var(--lo)}.ok{color:var(--ok)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.pl2{padding:8px 0;border-bottom:1px solid var(--bd)}
.f{display:flex;flex-direction:column;gap:2px;flex:1;min-width:130px}.f span{font-size:12px;color:var(--mut)}.f>*{width:100%;min-width:0}
.g3{display:grid;grid-template-columns:1.2fr 1fr 1.35fr;gap:8px;margin-bottom:8px}.g3 .f{min-width:0}.g3 select{padding-left:6px;padding-right:2px}
.mn{display:flex;flex-direction:column;gap:6px;padding:6px 0 10px;border-bottom:1px solid var(--bd)}
.dots{flex:0 0 auto;min-width:44px;font-size:20px;line-height:1;padding:6px 10px}
.row>.f.s{flex:0 0 100px;min-width:90px}.row>.f.m{flex:0 0 130px;min-width:110px}
.pl{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}
.g3{display:grid;grid-template-columns:1.2fr 1fr 1.35fr;gap:8px;margin-bottom:8px}.g3 .f{min-width:0}.g3 select{padding-left:6px;padding-right:2px}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px}.ln{flex:1;min-width:0;overflow-wrap:break-word;word-break:normal}.tt{font-weight:600;overflow-wrap:break-word}
.mw{position:relative;flex:0 0 auto}.dots{font-size:20px;line-height:1;padding:2px 12px}
.menu{position:absolute;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;display:flex;flex-direction:column;min-width:130px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.menu[hidden]{display:none}.menu button{border:0;text-align:left;padding:10px 12px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 8px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px}
.pk.n{background:color-mix(in srgb,var(--ac) 20%,transparent)}.pk.r{background:color-mix(in srgb,var(--lo) 25%,transparent)}
.bd{font-size:12px;color:var(--mut);flex:0 0 auto}.pk.n .bd,.pk.r .bd{color:var(--fg);font-weight:600}
.ih{margin:14px 0 2px;font-size:13px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--bd)}.kv span{color:var(--mut)}.kv b{text-align:right;font-weight:600}
#lista[hidden]{display:none}
.ib{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border-radius:10px}
.hd{display:flex;align-items:center;gap:12px;margin:2px 0 12px}.hd h1{margin:0}
.ib{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:10px}
nav{display:block;margin-bottom:0}nav .hd .ib{flex:0 0 44px;min-width:0;width:44px}
.home{position:relative;min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8px}
body.hm::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(4,39,29,.62),rgba(4,39,29,.22) 38%,rgba(4,39,29,.55)),url(fundo.jpg) center/cover no-repeat}
body.hm .bn{text-shadow:0 1px 6px rgba(0,0,0,.7)}
.ht{position:relative;font-size:26px;line-height:1.25;margin:0;max-width:540px;text-shadow:0 1px 8px var(--bg),0 0 2px var(--bg)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}#ov[hidden]{display:none}
#dr{position:fixed;top:0;left:0;bottom:0;width:min(82vw,320px);background:var(--card);border-right:1px solid var(--bd);transform:translateX(-102%);transition:transform .22s ease;z-index:20;padding-top:env(safe-area-inset-top,0px);overflow-y:auto;visibility:hidden}
#dr.open{transform:none;visibility:visible}
.dl{display:block;height:110px;margin:22px auto 14px}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:17px 20px;text-align:left;font-size:17px;background:transparent}
.mi i{font-style:normal;color:var(--mut);font-size:22px}.mi.on{background:var(--ac);color:var(--onac,#fff)}.mi.on i{color:var(--onac,#fff)}
.bn{flex:1;font-weight:700;font-size:15px;line-height:1.25}.sec{margin:4px 0 12px}
</style></head><body><main>

<nav id="nav"></nav>
<div id="v"></div>
</main>
<div id="ov" hidden onclick="closeM()"></div>
<aside id="dr" aria-hidden="true" aria-label="Menu"><img src="emblema.png" alt="" class="dl">
<button class="mi" data-t="home" onclick="go('home')"><span>Início</span><i>›</i></button>
<button class="mi" data-t="eq" onclick="go('eq')"><span>Equilíbrio</span><i>›</i></button>
<button class="mi" data-t="ev" onclick="go('ev')"><span>Cerimónias</span><i>›</i></button>
<button class="mi" data-t="ef" onclick="go('ef')"><span>Efetivos</span><i>›</i></button>
<button class="mi" data-t="bk" onclick="go('bk')"><span>Cópia de segurança</span><i>›</i></button></aside>
<script>
const ES=["Nomeado","Reserva"];
const POSTOS=["GPROV","GUARDA","GPRIN","CABO","CCH","CMOR","FUR","2SAR","1SAR","SAJ","SCH","SMOR"];
const LEG={};POSTOS.forEach(x=>LEG[x]=x);
Object.assign(LEG,{"CCHEFE":"CCH","GUARDAPROVISÓRIO":"GPROV","GUARDAPRINCIPAL":"GPRIN","CABOCHEFE":"CCH","CABOMOR":"CMOR","FURRIEL":"FUR","2ºSARGENTO":"2SAR","1ºSARGENTO":"1SAR","SARGENTOAJUDANTE":"SAJ","SARGENTOCHEFE":"SCH","SARGENTOMOR":"SMOR"});
const INSTR=["Oboé","Flauta","Requinta","Clarinete","Fagote","Sax. Alto","Sax. Tenor","Trompa","Trompete","Trombone","Bombardino","Tuba","Percussão"];
let mn=null,ed=null;
let lastAdd={posto:"GUARDA",inst:""};
let S={people:[],events:[]},tab="home",edit=null,fl={a:"",b:""};
const mig=()=>{S.events.forEach(e=>e.n.forEach(x=>{if(x.s!=="Reserva")x.s="Nomeado"}));S.people.forEach(p=>{const k=String(p.posto||"").toUpperCase().replace(/[\s.\-]/g,"");if(LEG[k])p.posto=LEG[k];fixP(p)})};
try{const r=localStorage.getItem("nb1");if(r){S=JSON.parse(r);mig()}}catch(e){}
const save=()=>{try{localStorage.setItem("nb1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const P=id=>S.people.find(p=>p.id===id);
const TT={eq:"Equilíbrio",ev:"Cerimónias",ef:"Efetivos",bk:"Cópia de segurança"};
function nav(){document.body.classList.toggle("hm",tab==="home");$("#nav").innerHTML=`<div class="hd"><button class="ib" aria-label="Abrir menu" title="Menu" onclick="openM()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><div class="bn">Banda Sinfónica da Guarda Nacional Republicana</div></div>${TT[tab]?`<h1 class="sec">${TT[tab]}</h1>`:""}`;
document.querySelectorAll(".mi").forEach(b=>b.classList.toggle("on",b.dataset.t===tab))}
function openM(){$("#ov").hidden=false;$("#dr").classList.add("open");$("#dr").setAttribute("aria-hidden","false")}
function closeM(){$("#ov").hidden=true;$("#dr").classList.remove("open");$("#dr").setAttribute("aria-hidden","true")}
function go(t){tab=t;edit=null;edId=null;vw=null;closeM();draw();window.scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
function vHome(){return `<div class="home"></div>`}
function draw(){nav();$("#v").innerHTML={home:vHome,eq:vEq,ev:vEv,ef:vEf,bk:vBk}[tab]()}
/* Efetivos */
function nk(t){return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[\s.]/g,"")}
function fixP(p){if(p.adido===undefined){const o=String(p.ordem||"");if(o&&o.length!==7){p.adido=o;p.ordem=""}else p.adido=""}
p.ordem=String(p.ordem||"");const m=INSTR.find(i=>nk(i)===nk(p.inst));if(m)p.inst=m}
function opts(list,sel,ph){return (sel&&!list.includes(sel)?`<option selected>${esc(sel)}</option>`:"")+(ph?`<option value="" ${sel?"":"selected"}>${ph}</option>`:"")+list.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("")}
const fld=(l,c,h)=>`<label class="f ${c}"><span>${l}</span>${h}</label>`;
const DG="this.value=this.value.replace(/\\D/g,'')";
let edId=null;
function frm(x,p){return `<div class="g3">${fld("Posto","",`<select id="${x}P">${opts([...POSTOS].reverse(),p.posto)}</select>`)}${fld("Nº Adido","",`<input id="${x}A" inputmode="numeric" value="${esc(p.adido)}" oninput="${DG}">`)}${fld("Nº Ordem","",`<input id="${x}O" inputmode="numeric" maxlength="7" value="${esc(p.ordem)}" oninput="${DG}">`)}</div>
<div class="row">${fld("Nome","",`<input id="${x}N" value="${esc(p.nome)}">`)}</div>
<div class="row">${fld("Instrumento","",`<select id="${x}I">${opts(INSTR,p.inst,"Selecionar")}</select>`)}</div>`}
const rk=p=>{const i=POSTOS.indexOf(p.posto);return i<0?-1:i};
const ad=p=>p.adido?parseInt(p.adido,10):Infinity;
function cmpH(a,b){const d=rk(b)-rk(a);if(d)return d;const x=ad(a),y=ad(b);if(x!==y)return x<y?-1:1;return String(a.nome).localeCompare(String(b.nome),"pt")}
function vEf(){const L=[...S.people].sort(cmpH),v=x=>esc(x||"–");
return `<div class="card"><h2>Adicionar efetivo</h2>${frm("n",{posto:lastAdd.posto,inst:lastAdd.inst})}
<div class="row"><button class="pri" onclick="addP()">Adicionar</button></div></div>
<div class="card"><h2>Cadastro (${L.length})</h2>
${L.map(p=>p.id===edId?`<div class="pl2">${frm("e",p)}<div class="row"><button class="pri" onclick="saveE()">Guardar</button><button onclick="edId=null;draw()">Cancelar</button></div></div>`
:`<div class="pl2 pr"><span class="ln">${v(p.posto)}; ${v(p.adido)}; ${v(p.ordem)}; ${v(p.nome)}; ${v(p.inst)}</span><div class="mw"><button class="dots" aria-label="Opções" onclick="tm(event,'${p.id}')">⋯</button><div class="menu" id="m_${p.id}" hidden><button onclick="edId='${p.id}';draw()">Editar</button><button class="del" onclick="delP('${p.id}')">Remover</button></div></div></div>`).join("")||`<p class="mut">Ainda sem efetivos.</p>`}</div>`}
function cm(){document.querySelectorAll(".menu").forEach(m=>m.hidden=true)}
function tm(e,id){e.stopPropagation();const m=document.getElementById("m_"+id),was=!m.hidden;cm();m.hidden=was}
document.addEventListener("click",cm);
function saveE(){const p=P(edId);if(!p)return;const o=$("#eO").value.trim(),n=$("#eN").value.trim();
if(!/^\d{7}$/.test(o))return alert("O Nº Ordem tem de ter exatamente 7 algarismos.");
if(!n)return alert("Escreva o nome.");
if(S.people.some(q=>q.id!==p.id&&q.ordem===o))return alert("Já existe outro efetivo com este Nº Ordem.");
p.posto=$("#eP").value;p.adido=$("#eA").value.trim();p.ordem=o;p.nome=n;p.inst=$("#eI").value;edId=null;save();draw()}
function addP(){const n=$("#nN").value.trim(),o=$("#nO").value.trim(),a=$("#nA").value.trim(),po=$("#nP").value,i=$("#nI").value;
if(!/^\d{7}$/.test(o))return alert("O Nº Ordem tem de ter exatamente 7 algarismos.");
if(!n)return alert("Escreva o nome.");
if(S.people.some(q=>q.ordem===o))return alert("Já existe um efetivo com este Nº Ordem.");
S.people.push({id:uid(),posto:po,adido:a,ordem:o,nome:n,inst:i});lastAdd={posto:po,inst:i};save();draw()}
function edP(id,k,v){const p=P(id);if(!p)return;
if(k==="ordem"){v=v.replace(/\D/g,"");
if(!/^\d{7}$/.test(v)){alert("O Nº Ordem tem de ter exatamente 7 algarismos.");return draw()}
if(S.people.some(q=>q.id!==id&&q.ordem===v)){alert("Já existe outro efetivo com este Nº Ordem.");return draw()}p.ordem=v}
else if(k==="nome"){if(!v.trim()){alert("O nome não pode ficar vazio.");return draw()}p.nome=v.trim()}
else if(k==="adido")p.adido=v.replace(/\D/g,"");
else p[k]=v;save()}
function delP(id){if(!confirm("Remover este efetivo e os seus registos?"))return;S.people=S.people.filter(p=>p.id!==id);S.events.forEach(e=>e.n=e.n.filter(x=>x.p!==id));save();draw()}
/* Cerimónias */
let vw=null;
const fd=d=>d?d.split("-").reverse().join("/"):"";
const EV=id=>S.events.find(x=>x.id===id);
const iR=p=>{const i=INSTR.indexOf(p.inst);return i<0?99:i};
function cmpI(a,b){return iR(a)-iR(b)||cmpH(a,b)}
function vEv(){if(edit)return fEv();if(vw)return vBanda();
const L=S.events;
return `<div class="card"><div class="row"><h2 style="flex:3;margin:0">Cerimónias (${L.length})</h2><button class="pri" onclick="newEv()">+ Nova cerimónia</button></div>
${L.map(e=>{const n=e.n.filter(x=>x.s==="Nomeado").length;return `<div class="pl2 pr"><div class="ln" onclick="vw='${e.id}';draw()" style="cursor:pointer"><div class="tt">${esc(e.nome||e.local||"Sem nome")}</div><div class="mut">${fd(e.data)}${e.local&&e.nome?" · "+esc(e.local):""} · ${n} nomeados${e.montada?"":" · por montar"}</div></div>
<div class="mw"><button class="dots" aria-label="Opções" onclick="tm(event,'${e.id}')">⋯</button><div class="menu" id="m_${e.id}" hidden><button onclick="edit='${e.id}';draw()">Editar</button><button class="del" onclick="delE('${e.id}')">Remover</button></div></div></div>`}).join("")||`<p class="mut">Ainda sem cerimónias.</p>`}</div>`}
function newEv(){const e={id:uid(),data:new Date().toISOString().slice(0,10),nome:"",local:"",tipo:"Cerimónia",viag:null,n:[],montada:false};S.events.push(e);edit=e.id;vw=null;save();draw()}
function delE(id){if(!confirm("Apagar esta cerimónia?"))return;S.events=S.events.filter(e=>e.id!==id);save();draw()}
function stl(s){return s==="Nomeado"?["n","Nomeado"]:s==="Reserva"?["r","Reserva"]:["","—"]}
function cnt(e){const n=e.n.filter(x=>x.s==="Nomeado").length,r=e.n.filter(x=>x.s==="Reserva").length;return `${n} nomeados · ${r} em reserva`}
function fEv(){const e=EV(edit);if(!e){edit=null;return vEv()}
const st=id=>(e.n.find(x=>x.p===id)||{}).s||"";let last=null;
const rows=[...S.people].sort(cmpI).map(p=>{const h=p.inst||"Sem instrumento",t=h!==last?`<div class="ih">${esc(h)}</div>`:"";last=h;const[c,l]=stl(st(p.id));
return t+`<div class="pk ${c}" id="r_${p.id}" onclick="cyc('${p.id}')"><span class="ln">${esc(p.posto||"–")} · ${esc(p.adido||"–")} · ${esc(p.nome)}</span><span class="bd" id="b_${p.id}">${l}</span></div>`}).join("");
return `<div class="card"><h2>${e.montada?"Editar cerimónia":"Nova cerimónia"}</h2><div class="row">${fld("Nome da cerimónia","",`<input value="${esc(e.nome)}" placeholder="Ex.: Cartaxo – CTER Santarém" onchange="up('nome',this.value)">`)}</div>
<div class="g3" style="grid-template-columns:1fr 1fr">
${fld("Local","",`<input value="${esc(e.local)}" placeholder="Ex.: Cartaxo" onchange="up('local',this.value);calcViagem()">`)}
${fld("Data","",`<input type="date" value="${e.data}" onchange="up('data',this.value)">`)}</div>
<div class="g3" style="grid-template-columns:1fr 1fr">
${fld("Viagem (ida)","",`<input id="vg" value="${e.viag!=null?fmtV(e.viag):""}" placeholder="—" onchange="setV(this.value)">`)}
${fld("Tipo","",`<input value="${esc(e.tipo)}" onchange="up('tipo',this.value)">`)}</div>
<p class="mut" id="vst">${e.viagInfo?esc(e.viagInfo):"A viagem é calculada ao indicar o local, a partir da Calçada da Ajuda. Pode corrigir o valor à mão."}</p>
<div class="row"><button onclick="calcViagem()">Calcular viagem</button></div></div>
<div class="card"><h2>Montar a banda</h2>
<p class="mut">Toque numa pessoa para a marcar: uma vez <b>Nomeado</b>, duas vezes <b>Reserva</b>, três vezes para retirar.</p>
<p id="cnt"><b>${cnt(e)}</b></p>
${rows||`<p class="mut">Adicione primeiro os efetivos no separador Efetivos.</p>`}
<div class="row" style="margin-top:12px"><button class="pri" onclick="montar()">Montar Banda</button><button onclick="edit=null;draw()">Voltar</button></div></div>`}
const fmtV=m=>m<60?m+"min":Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"min";
function parseV(t){t=String(t).trim().toLowerCase();let m=t.match(/^(\d+)\s*h\s*(\d{1,2})?/);if(m)return +m[1]*60+(+m[2]||0);m=t.match(/^(\d+)\s*(min|m)?$/);return m?+m[1]:null}
function setV(v){const e=EV(edit);if(!v.trim()){e.viag=null;e.viagInfo="";save();return}const m=parseV(v);if(m==null){alert("Escreva a duração, por exemplo 1h 05min ou 65.");$("#vg").value=e.viag!=null?fmtV(e.viag):"";return}e.viag=m;e.viagInfo="Valor introduzido à mão.";$("#vg").value=fmtV(m);$("#vst").textContent=e.viagInfo;save()}
async function geo(q){const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=pt&q="+encodeURIComponent(q));const j=await r.json();return j[0]?{lat:+j[0].lat,lon:+j[0].lon}:null}
async function origem(){try{const c=JSON.parse(localStorage.getItem("nbo"));if(c&&c.lat)return c}catch(e){}
try{const o=await geo("Calçada da Ajuda, Lisboa");if(o){try{localStorage.setItem("nbo",JSON.stringify(o))}catch(e){}return o}}catch(e){}
return{lat:38.7057,lon:-9.1985}}
async function calcViagem(){const e=EV(edit);if(!e)return;const q=(e.local||"").trim(),id=e.id,st=()=>$("#vst");
if(!q){if(st())st().textContent="Indique primeiro o local.";return}
if(st())st().textContent="A calcular a viagem…";
try{const o=await origem(),d=await geo(q);if(!d)throw"local";
const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${o.lon},${o.lat};${d.lon},${d.lat}?overview=false`),j=await r.json();
if(!j.routes||!j.routes[0])throw"rota";
if(e.local.trim()!==q)return;
e.viag=Math.round(j.routes[0].duration/60);const km=Math.round(j.routes[0].distance/1000);
e.viagInfo=`${km} km desde a Calçada da Ajuda · estimativa sem trânsito. Pode corrigir à mão.`;save();

function vBanda(){const e=EV(vw);if(!e){vw=null;return vEv()}

const HV=()=>{const h=S.cfg&&parseFloat(S.cfg.h);return h>0?h:4};

function vEq(){const ev=S.events.filter(e=>(!fl.a||e.data>=fl.a)&&(!fl.b||e.data<=fl.b)),sv=ev.filter(e=>e.viag==null&&e.n.some(x=>x.s==="Nomeado")).length;

${sv?`<p class="mut"><b>${sv}</b> cerimónia(s) sem viagem preenchida contam só 1 ponto.</p>`:""}</div>
<div class="card"><div class="tw"><table><tr><th>Pessoa</th><th>Nomeações</th><th>Esforço</th><th></th><th>Viagem</th><th>Reserva</th><th>Estado</th></tr>

<p class="mut">Partilha igual: ${fair.toFixed(1)}% por pessoa. O alerta dispara quando os pontos de uma pessoa se afastam mais de 25% da média.</p></div>`}
