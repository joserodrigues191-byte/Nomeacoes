<script>
const ES=["Nomeado","Reserva"];
const POSTOS=["GPROV","GUARDA","GPRIN","CABO","CCH","CMOR","FUR","2SAR","1SAR","SAJ","SCH","SMOR","ALF","TEN","CAP","MAJ","TCOR","COR"];
const LEG={};POSTOS.forEach(x=>LEG[x]=x);
Object.assign(LEG,{"CCHEFE":"CCH","GUARDAPROVISÓRIO":"GPROV","GUARDAPRINCIPAL":"GPRIN","CABOCHEFE":"CCH","CABOMOR":"CMOR","FURRIEL":"FUR","2ºSARGENTO":"2SAR","1ºSARGENTO":"1SAR","SARGENTOAJUDANTE":"SAJ","SARGENTOCHEFE":"SCH","SARGENTOMOR":"SMOR"});
const INSTR=["Oboé","Flauta","Requinta","Clarinete","Fagote","Sax. Alto","Sax. Tenor","Trompa","Trompete","Trombone","Bombardino","Tuba","Percussão","Violino","Viola","Violoncelo","Contrabaixo"];
let mn=null,ed=null;
let lastAdd={posto:"GUARDA",inst:""};
let S={people:[],events:[]},tab="ev",edit=null,fl={a:"",b:"",n:"",x:"",sh:0,sp:0,so:false,pp:"",ey:"",en:""};
const mig=()=>{S.events.forEach(e=>e.n.forEach(x=>{if(x.s!=="Reserva")x.s="Nomeado"}));S.people.forEach(p=>{const k=String(p.posto||"").toUpperCase().replace(/[\s.\-]/g,"");if(LEG[k])p.posto=LEG[k];fixP(p)})};
try{const r=localStorage.getItem("nb1");if(r){S=JSON.parse(r);mig()}}catch(e){}
const save=()=>{try{localStorage.setItem("nb1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const P=id=>S.people.find(p=>p.id===id);
const TT={mais:"Mais",ec:"Evolução",eq:"Equilíbrio",ev:"Serviços",ef:"Efetivos",bk:"Cópia de segurança"};
const IC={ev:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',eq:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',ec:'<path d="M3 17l6-6 4 4 8-8"/>',ef:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 8a3 3 0 010 6M21 20c0-2.6-1.6-4.8-4-5.6"/>',mais:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'};

$("#nav").innerHTML=`<div class="bnm">Banda Sinfónica da Guarda Nacional Republicana</div>${back?`<button class="bkb" onclick="${back[1]}">${back[0]}</button>`:""}${det?"":`<div class="hr2"><h1 class="sec">${all?"Todas":(TT[tab]||"")}</h1>${all?`<button class="pri" onclick="novoServ()">+ Novo</button>`:""}</div>`}`;
$("#tb").innerHTML=[["ev","Serviços"],["ef","Efetivos"],["eq","Equilíbrio"],["ec","Evolução"],["mais","Mais"]].map(([k,n])=>`<button class="${tab===k||(k==="mais"&&tab==="bk")?"on":""}" onclick="go('${k}')"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${n}</button>`).join("")}
function go(t){{const z=$("#ts");if(z)z.hidden=true}tab=t;cl=false;edit=null;edId=null;vw=null;if(t==="eq")fl.n="";draw();window.scrollTo(0,0)}
function draw(){nav();setTimeout(()=>{const e=tab==="ev"&&edit?EV(edit):null;if(e&&e.ens)ensSum(e)},0);$("#v").innerHTML={mais:vMais,ec:vEc,eq:vEq,ev:vEv,ef:vEf,bk:vBk}[tab]();loadImgs()}
function vMais(){const n=S.people.length;
return `<div class="sh">Cálculo do esforço</div>
<div class="card"><div class="g3" style="grid-template-columns:1fr 1fr">${fld("Horas por ponto","",`<input type="number" step="0.5" min="0.5" inputmode="decimal" value="${HV()}" onchange="setH(this.value)">`)}${fld("Limite dos alertas (%)","",`<input type="number" step="1" min="1" max="100" inputmode="numeric" value="${TH()}" onchange="setP(this.value)">`)}</div>
<div class="row" style="margin:0 0 8px">${fld("Horas de ensaio por ponto","",`<input type="number" step="0.5" min="0.5" inputmode="decimal" value="${HE()}" onchange="setHe(this.value)">`)}</div>
<p class="mut">A cada ${HV()} h de viagem (ida e volta) soma-se mais 1 ponto, e a cada ${hTx(HE())} h de ensaio também.</p>
<div class="row" style="margin:0"><button onclick="fl.so=true;go('eq')">Simular outros valores</button></div></div>
<div class="card"><h2>Como se calcula</h2>
<p class="mut" style="margin-top:0">Cada pessoa soma pontos por cada serviço para que foi nomeada. Quanto mais esforço, mais pontos. Depois compara-se com os colegas do mesmo naipe.</p>
<div class="ex2"><h3>Cerimónias</h3><p>Cada nomeação vale <b>1 ponto</b>, mais <b>1 ponto a cada ${hTx(HV())} h de viagem</b> (ida e volta).</p>
<p class="mut">Exemplos: 20 min de ida valem ${(1+2*20/60/HV()).toFixed(2).replace(".",",")} pontos. 5 h de ida valem ${(1+2*300/60/HV()).toFixed(2).replace(".",",")} pontos.</p>
<p class="mut">A viagem é calculada de carro, a partir da Calçada da Ajuda, sem trânsito, e pode ser corrigida à mão. Se não estiver preenchida, conta só 1 ponto.</p></div>
<div class="ex2"><h3>Concertos</h3><p>Contam <b>exatamente como as cerimónias</b>: 1 ponto por nomeação, mais o agravante da viagem. Vale para a Banda e para a Orquestra.</p>
<p class="mut">Os ensaios de um concerto contam à parte, como ensaios.</p></div>
<div class="ex2"><h3>Ensaios</h3><p>Não há viagem. Cada <b>${hTx(HE())} h de ensaio valem 1 ponto</b>. As horas são os dias marcados vezes a duração de cada ensaio.</p>
<p class="mut">Exemplo: 5 ensaios de 2 h são 10 h e valem ${hTx(10/HE())} pontos. Uma semana de ensaios conta como 1 nomeação.</p></div>
<div class="ex2"><h3>Reserva</h3><p>Quem está em reserva <b>não soma pontos</b>. Conta-se o que consta nas listas, não a presença efetiva.</p></div>
<div class="ex2"><h3>Comparação</h3><p>Cada pessoa compara-se com a <b>média do seu naipe</b> (a Requinta conta no Clarinete). A Banda e a Orquestra contam da mesma forma.</p></div>
<div class="ex2"><h3>Alertas</h3><p>Aparece <b>“acima”</b> ou <b>“abaixo”</b> quando os pontos de alguém se afastam mais de <b>${TH()}%</b> da média do naipe, com uma folga mínima de 0,5 pontos.</p></div>
</div>
<div class="sh">Dados</div>
<div class="cm" onclick="go('bk')" style="cursor:pointer;display:flex;align-items:center;gap:8px"><div class="ln"><div class="tt">Cópia de segurança</div><div class="mut">Guardar ou restaurar os dados</div></div><span class="mut" style="font-size:24px">›</span></div>
${vBin()}${(S.log||[]).length?`<div class="cm lgd"><details><summary><b>Registo de remoções</b> (${S.log.length})</summary>${[...S.log].reverse().map(l=>`<div class="hl mut"><b>${fdt(l.t)}</b> · ${esc(l.a)}</div>`).join("")}</details></div>`:""}`}
/* Reciclagem */
function bin(k,d,refs){const id=uid();(S.bin=S.bin||[]).push({id,t:new Date().toISOString(),k,d,refs:refs||[]});return id}
function binDel(id,q){const b=(S.bin||[]).find(x=>x.id===id);if(!b)return;if(!q&&!confirm("Apagar definitivamente? Não poderá ser recuperado."))return;if(b.k==="e")(b.d.fotos||[]).forEach(f=>{fDel(f.id);delete urls[f.id]});S.bin=S.bin.filter(x=>x.id!==id);save();if(!q)draw()}
function binRest(id){const b=(S.bin||[]).find(x=>x.id===id);if(!b)return;
if(b.k==="e")S.events.push(b.d);else{if(b.d.ordem&&S.people.some(q=>q.ordem===b.d.ordem))return alert("Já existe outro efetivo com este Nº Ordem. Não é possível restaurar.");S.people.push(b.d);b.refs.forEach(r=>{const e=EV(r.e);if(e&&!e.n.some(x=>x.p===b.d.id))e.n.push({p:b.d.id,s:r.s})})}
S.bin=S.bin.filter(x=>x.id!==id);(S.log=S.log||[]).push({t:new Date().toISOString(),a:"Restaurado: "+(b.k==="e"?(b.d.nome||b.d.local||"serviço"):b.d.posto+" "+b.d.nome)});save();draw()}
function purgeBin(){const lim=Date.now()-30*864e5;(S.bin||[]).filter(b=>new Date(b.t)<lim).forEach(b=>binDel(b.id,true))}

window._tu=()=>{t.hidden=true;clearTimeout(tmr);fn()};t.innerHTML=`<span>${esc(msg)}</span><button onclick="_tu()">Desfazer</button>`;t.hidden=false;clearTimeout(tmr);tmr=setTimeout(()=>t.hidden=true,8000)}

return `<div class="cm lgd"><details><summary><b>Reciclagem</b> (${B.length})</summary><p class="mut">Apagado há menos de 30 dias. Passado esse tempo é removido de vez.</p>${B.map(b=>`<div class="hl"><div class="tt">${b.k==="e"?esc(b.d.tipo||"Serviço")+" · "+fd(b.d.data)+" · "+esc(b.d.nome||b.d.local||"Sem nome"):"Efetivo · "+esc(b.d.posto)+" "+esc(b.d.nome)}</div><div class="mut">${fdt(b.t)}</div><div class="row" style="margin:6px 0 0"><button class="pri" onclick="binRest('${b.id}')">Restaurar</button><button class="del" onclick="binDel('${b.id}')">Apagar de vez</button></div></div>`).join("")}</details></div>`}

p.ordem=String(p.ordem||"");const m=INSTR.find(i=>nk(i)===nk(p.inst));if(m)p.inst=m}
function opts(list,sel,ph){return (sel&&!list.includes(sel)?`<option selected>${esc(sel)}</option>`:"")+(ph?`<option value="" ${sel?"":"selected"}>${ph}</option>`:"")+list.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("")}
const GRP_P=[["Oficiais",["COR","TCOR","MAJ","CAP","TEN","ALF"]],["Sargentos",["SMOR","SCH","SAJ","1SAR","2SAR","FUR"]],["Praças",["CMOR","CCH","CABO","GPRIN","GUARDA","GPROV"]]];

:`<div class="pl2 pr"><span style="flex:0 0 30px;text-align:right;color:var(--ok);font-weight:700;margin-right:8px">${esc(p.adido||"–")}</span><span style="flex:0 0 48px;color:var(--mut);font-size:13px">${esc(p.posto||"–")}</span><span class="ln"><b>${esc(p.nome)}</b><br><span class="mut" style="font-size:12px">${esc(p.ordem||"–")} · ${esc(CATS.includes(p.cat)?p.cat:(p.inst||"Sem instrumento"))}${p.cat===GH?" · Chefia GH":""}</span></span><div class="mw"><button class="dots" aria-label="Opções" onclick="tm(event,'${p.id}')">⋯</button><div class="menu" id="m_${p.id}" hidden><button onclick="edId='${p.id}';draw()">Editar</button><button class="del" onclick="delP('${p.id}')">Remover</button></div></div></div>`).join("")||`<p class="mut">Ainda sem efetivos.</p>`)+`</div>`}

return (fl.nf?`<div class="card"><h2>Adicionar efetivo</h2>${frm("n",{posto:lastAdd.posto,inst:lastAdd.inst,g:lastAdd.g})}

:`<div class="pl2 pr"><span class="ln">${v(p.posto)}; ${v(p.adido)}; ${v(p.ordem)}; ${v(p.nome)}${p.inst&&p.inst!==n?"; "+v(p.inst):""}${p.cat===GH?` <span class="mut">(Chefia GH)</span>`:""}${p.g&&p.g!=="B"?` <span class="mut">(${p.g==="O"?"só orquestra":"banda + orquestra"})</span>`:""}</span><div class="mw"><button class="dots" aria-label="Opções" onclick="tm(event,'${p.id}')">⋯</button><div class="menu" id="m_${p.id}" hidden><button onclick="edId='${p.id}';draw()">Editar</button><button class="del" onclick="delP('${p.id}')">Remover</button></div></div></div>`).join("")}</details>`}).join("")||`<p class="mut">Ainda sem efetivos.</p>`}</div>`}

function saveE(){const p=P(edId);if(!p)return;const o=$("#eO").value.trim(),n=$("#eN").value.trim();

if(!n)return alert("Escreva o nome.");
if(S.people.some(q=>q.id!==p.id&&q.ordem===o))return alert("Já existe outro efetivo com este Nº Ordem.");
p.posto=$("#eP").value;p.adido=$("#eA").value.trim();p.ordem=o;p.nome=n;p.cat=$("#eC").value;p.inst=CATS.includes(p.cat)?"":$("#eI").value;p.g=CATS.includes(p.cat)?"BO":$("#eG").value;edId=null;save();draw()}

function edP(id,k,v){const p=P(id);if(!p)return;
if(k==="ordem"){v=v.replace(/\D/g,"");
if(!/^\d{7}$/.test(v)){alert("O Nº Ordem tem de ter exatamente 7 algarismos.");return draw()}
if(S.people.some(q=>q.id!==id&&q.ordem===v)){alert("Já existe outro efetivo com este Nº Ordem.");return draw()}p.ordem=v}
else if(k==="nome"){if(!v.trim()){alert("O nome não pode ficar vazio.");return draw()}p.nome=v.trim()}
else if(k==="adido")p.adido=v.replace(/\D/g,"");

function delP(id){if(!confirm("Remover este efetivo e os seus registos?"))return;{const p=P(id);if(p)(S.log=S.log||[]).push({t:new Date().toISOString(),a:`Efetivo removido: ${p.posto} ${p.nome}`})}const pp0=P(id),rf=S.events.flatMap(e=>{const x=e.n.find(q=>q.p===id);return x?[{e:e.id,s:x.s}]:[]}),bid=pp0?bin("p",pp0,rf):null;S.people=S.people.filter(p=>p.id!==id);S.events.forEach(e=>e.n=e.n.filter(x=>x.p!==id));save();draw();if(bid)toast("Efetivo removido",()=>binRest(bid))}

/* Fotos das listas (IndexedDB, só neste dispositivo) */
const odb=()=>new Promise((ok,ko)=>{if(!window.indexedDB)return ko("sem IndexedDB");const r=indexedDB.open("nbf",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const fop=async(m,f)=>{const d=await odb();return new Promise((ok,ko)=>{const t=d.transaction("f",m),o=t.objectStore("f");let r;try{r=f(o)}catch(e){return ko(e)}t.oncomplete=()=>{d.close();ok(r&&r.result)};t.onerror=t.onabort=()=>ko(t.error)})};
const fPut=(id,v)=>fop("readwrite",o=>o.put(v,id)),fGet=id=>fop("readonly",o=>o.get(id)),fDel=id=>fop("readwrite",o=>o.delete(id)).catch(()=>{}),fClr=()=>fop("readwrite",o=>o.clear()).catch(()=>{});
