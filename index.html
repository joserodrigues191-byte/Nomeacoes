<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nomeações da Banda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nomeações">
<meta name="theme-color" content="#1f4e8c">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--fg:#1c2230;--mut:#667085;--card:#fff;--bd:#dfe3ea;--ac:#1f4e8c;--hi:#c0392b;--lo:#b7791f;--ok:#2f855a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--fg:#e8ebf1;--mut:#9aa4b5;--card:#1b202b;--bd:#2c3343;--ac:#6ea3e6;--hi:#ef7b6e;--lo:#e0b45c;--ok:#6fcf97}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
nav button{flex:1;min-width:110px}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.del{color:var(--hi)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row>*{flex:1;min-width:120px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:4px;min-width:90px;position:relative}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ac)}
.tag{padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}
.hi{color:var(--hi)}.lo{color:var(--lo)}.ok{color:var(--ok)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.pl2{padding:8px 0;border-bottom:1px solid var(--bd)}
.f{display:flex;flex-direction:column;gap:2px;flex:1;min-width:130px}.f span{font-size:12px;color:var(--mut)}.f>*{width:100%;min-width:0}
.g3{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;margin-bottom:8px}.g3 .f{min-width:0}
.ln{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.ln b{flex:1;font-weight:500;word-break:break-word}
.mn{display:flex;flex-direction:column;gap:6px;padding:6px 0 10px;border-bottom:1px solid var(--bd)}
.dots{flex:0 0 auto;min-width:44px;font-size:20px;line-height:1;padding:6px 10px}
.row>.f.s{flex:0 0 100px;min-width:90px}.row>.f.m{flex:0 0 130px;min-width:110px}
.pl{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}
.g3{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;margin-bottom:8px}.g3 .f{min-width:0}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px}.ln{flex:1;min-width:0;overflow-wrap:anywhere}
.mw{position:relative;flex:0 0 auto}.dots{font-size:20px;line-height:1;padding:2px 12px}
.menu{position:absolute;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;display:flex;flex-direction:column;min-width:130px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.menu[hidden]{display:none}.menu button{border:0;text-align:left;padding:10px 12px}
</style></head><body><main>
<h1>Nomeações da Banda</h1>
<nav id="nav"></nav>
<div id="v"></div>
</main>
<script>
const ES=["Nomeado","Reserva"];
const POSTOS=["GPROV","GUARDA","GPRIN","CABO","CCH","CMOR","FUR","2SAR","1SAR","SAJ","SCH","SMOR"];
const LEG={};POSTOS.forEach(x=>LEG[x]=x);
Object.assign(LEG,{"CCHEFE":"CCH","GUARDAPROVISÓRIO":"GPROV","GUARDAPRINCIPAL":"GPRIN","CABOCHEFE":"CCH","CABOMOR":"CMOR","FURRIEL":"FUR","2ºSARGENTO":"2SAR","1ºSARGENTO":"1SAR","SARGENTOAJUDANTE":"SAJ","SARGENTOCHEFE":"SCH","SARGENTOMOR":"SMOR"});
const INSTR=["Oboé","Flauta","Requinta","Clarinete","Fagote","Sax. Alto","Sax. Tenor","Trompa","Trompete","Trombone","Bombardino","Tuba","Percussão"];
let mn=null,ed=null;
let lastAdd={posto:"GUARDA",inst:""};
let S={people:[],events:[]},tab="eq",edit=null,fl={a:"",b:""};
const mig=()=>{S.events.forEach(e=>e.n.forEach(x=>{if(x.s!=="Reserva")x.s="Nomeado"}));S.people.forEach(p=>{const k=String(p.posto||"").toUpperCase().replace(/[\s.\-]/g,"");if(LEG[k])p.posto=LEG[k];fixP(p)})};
try{const r=localStorage.getItem("nb1");if(r){S=JSON.parse(r);mig()}}catch(e){}
const save=()=>{try{localStorage.setItem("nb1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const P=id=>S.people.find(p=>p.id===id);
function nav(){$("#nav").innerHTML=[["eq","Equilíbrio"],["ev","Cerimónias"],["ef","Efetivos"],["bk","Cópia de segurança"]].map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';edit=null;edId=null;draw()">${n}</button>`).join("")}
function draw(){nav();$("#v").innerHTML={eq:vEq,ev:vEv,ef:vEf,bk:vBk}[tab]()}
/* Efetivos */
function nk(t){return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[\s.]/g,"")}
function fixP(p){if(p.adido===undefined){const o=String(p.ordem||"");if(o&&o.length!==7){p.adido=o;p.ordem=""}else p.adido=""}
p.ordem=String(p.ordem||"");const m=INSTR.find(i=>nk(i)===nk(p.inst));if(m)p.inst=m}
function opts(list,sel,ph){return (sel&&!list.includes(sel)?`<option selected>${esc(sel)}</option>`:"")+(ph?`<option value="" ${sel?"":"selected"}>${ph}</option>`:"")+list.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("")}
const fld=(l,c,h)=>`<label class="f ${c}"><span>${l}</span>${h}</label>`;
const DG="this.value=this.value.replace(/\\D/g,'')";
let edId=null;
function frm(x,p){return `<div class="g3">${fld("Posto","",`<select id="${x}P">${opts([...POSTOS].reverse(),p.posto)}</select>`)}${fld("Nº Adido","",`<input id="${x}A" inputmode="numeric" value="${esc(p.adido)}" oninput="${DG}">`)}${fld("Nº Ordem","",`<input id="${x}O" inputmode="numeric" maxlength="7" value="${esc(p.ordem)}" oninput="${DG}">`)}</div>
<div class="row">${fld("Nome","",`<input id="${x}N" value="${esc(p.nome)}">`)}</div>
<div class="row">${fld("Instrumento","",`<select id="${x}I">${opts(INSTR,p.inst,"Selecionar")}</select>`)}</div>`}
const rk=p=>{const i=POSTOS.indexOf(p.posto);return i<0?-1:i};
const ad=p=>p.adido?parseInt(p.adido,10):Infinity;
function cmpH(a,b){const d=rk(b)-rk(a);if(d)return d;const x=ad(a),y=ad(b);if(x!==y)return x<y?-1:1;return String(a.nome).localeCompare(String(b.nome),"pt")}
function vEf(){const L=[...S.people].sort(cmpH),v=x=>esc(x||"–");
return `<div class="card"><h2>Adicionar efetivo</h2>${frm("n",{posto:lastAdd.posto,inst:lastAdd.inst})}
<div class="row"><button class="pri" onclick="addP()">Adicionar</button></div></div>
<div class="card"><h2>Cadastro (${L.length})</h2>
${L.map(p=>p.id===edId?`<div class="pl2">${frm("e",p)}<div class="row"><button class="pri" onclick="saveE()">Guardar</button><button onclick="edId=null;draw()">Cancelar</button></div></div>`
:`<div class="pl2 pr"><span class="ln">${v(p.posto)}; ${v(p.adido)}; ${v(p.ordem)}; ${v(p.nome)}; ${v(p.inst)}</span><div class="mw"><button class="dots" aria-label="Opções" onclick="tm(event,'${p.id}')">⋯</button><div class="menu" id="m_${p.id}" hidden><button onclick="edId='${p.id}';draw()">Editar</button><button class="del" onclick="delP('${p.id}')">Remover</button></div></div></div>`).join("")||`<p class="mut">Ainda sem efetivos.</p>`}</div>`}
function cm(){document.querySelectorAll(".menu").forEach(m=>m.hidden=true)}
function tm(e,id){e.stopPropagation();const m=document.getElementById("m_"+id),was=!m.hidden;cm();m.hidden=was}
document.addEventListener("click",cm);
function saveE(){const p=P(edId);if(!p)return;const o=$("#eO").value.trim(),n=$("#eN").value.trim();
if(!/^\d{7}$/.test(o))return alert("O Nº Ordem tem de ter exatamente 7 algarismos.");
if(!n)return alert("Escreva o nome.");
if(S.people.some(q=>q.id!==p.id&&q.ordem===o))return alert("Já existe outro efetivo com este Nº Ordem.");
p.posto=$("#eP").value;p.adido=$("#eA").value.trim();p.ordem=o;p.nome=n;p.inst=$("#eI").value;edId=null;save();draw()}
function addP(){const n=$("#nN").value.trim(),o=$("#nO").value.trim(),a=$("#nA").value.trim(),po=$("#nP").value,i=$("#nI").value;
if(!/^\d{7}$/.test(o))return alert("O Nº Ordem tem de ter exatamente 7 algarismos.");
if(!n)return alert("Escreva o nome.");
if(S.people.some(q=>q.ordem===o))return alert("Já existe um efetivo com este Nº Ordem.");
S.people.push({id:uid(),posto:po,adido:a,ordem:o,nome:n,inst:i});lastAdd={posto:po,inst:i};save();draw()}
function edP(id,k,v){const p=P(id);if(!p)return;
if(k==="ordem"){v=v.replace(/\D/g,"");
if(!/^\d{7}$/.test(v)){alert("O Nº Ordem tem de ter exatamente 7 algarismos.");return draw()}
if(S.people.some(q=>q.id!==id&&q.ordem===v)){alert("Já existe outro efetivo com este Nº Ordem.");return draw()}p.ordem=v}
else if(k==="nome"){if(!v.trim()){alert("O nome não pode ficar vazio.");return draw()}p.nome=v.trim()}
else if(k==="adido")p.adido=v.replace(/\D/g,"");
else p[k]=v;save()}
function lerFoto(id,cb){const f=$("#foto").files[0],st=$("#st");if(!f)return alert("Escolha primeiro uma fotografia.");st.textContent="A preparar a imagem…";
const img=new Image();img.onerror=()=>st.textContent="Imagem inválida.";
img.onload=async()=>{const k=Math.min(1,2200/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;
for(let i=0;i<p.length;i+=4){let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];g=Math.max(0,Math.min(255,(g-128)*1.4+128));p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);
try{if(!window.Tesseract)await new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
const r=await Tesseract.recognize(c,"por",{logger:m=>{if(m.status)st.textContent=m.status+(m.progress?" "+Math.round(m.progress*100)+"%":"")}});
$("#"+id).value=r.data.text.replace(/[|_\[\]]/g," ");st.textContent="Leitura concluída.";cb()}
catch(e){st.textContent="Não foi possível ler a foto. Na primeira vez é preciso ligação à internet."}};
img.src=URL.createObjectURL(f)}
function delP(id){if(!confirm("Remover este efetivo e os seus registos?"))return;S.people=S.people.filter(p=>p.id!==id);S.events.forEach(e=>e.n=e.n.filter(x=>x.p!==id));save();draw()}
/* Cerimónias */
function vEv(){if(edit)return fEv();
return `<div class="card"><div class="row"><h2 style="flex:3;margin:0">Cerimónias (${S.events.length})</h2><button class="pri" onclick="newEv()">+ Nova cerimónia</button></div><div class="tw"><table><tr><th>Data</th><th>Local</th><th>Tipo</th><th>Dias</th><th>Nomeados</th><th></th></tr>
${[...S.events].sort((a,b)=>b.data.localeCompare(a.data)).map(e=>`<tr><td>${esc(e.data)}</td><td>${esc(e.local)}</td><td>${esc(e.tipo)}</td><td>${e.dias}</td><td>${e.n.filter(x=>x.s==="Nomeado").length}</td><td><button onclick="edit='${e.id}';draw()">Editar</button> <button class="del" onclick="delE('${e.id}')">Apagar</button></td></tr>`).join("")||`<tr><td colspan="6" class="mut">Ainda sem cerimónias.</td></tr>`}</table></div></div>`}
function newEv(){const e={id:uid(),data:new Date().toISOString().slice(0,10),local:"",tipo:"Cerimónia",dias:1,n:[]};S.events.push(e);edit=e.id;draw()}
function delE(id){if(!confirm("Apagar esta cerimónia?"))return;S.events=S.events.filter(e=>e.id!==id);save();draw()}
function fEv(){const e=S.events.find(x=>x.id===edit);if(!e){edit=null;return vEv()}
const st=id=>(e.n.find(x=>x.p===id)||{}).s||"";
return `<div class="card"><h2>Registo da cerimónia</h2><details open style="margin-bottom:10px"><summary><b>Ler lista</b> (foto ou texto)</summary><p class="mut">Escolha a fotografia da lista e carregue em “Ler foto”. Depois confirme a data, o local e as pessoas. Se preferir, cole o texto copiado da foto.</p><div class="row"><input type="file" id="foto" accept="image/*"><button class="pri" onclick="lerFoto('paste',readList)">Ler foto</button></div><p class="mut" id="st"></p><p class="mut">Na fotografia, mantenha o dedo sobre o texto, selecione tudo, copie e cole aqui. As pessoas são reconhecidas pelo nome ou pela ordem, por isso o cadastro tem de estar preenchido.</p><textarea id="paste" placeholder="Texto da lista (preenchido automaticamente ao ler a foto)"></textarea><div class="row"><button class="pri" onclick="readList()">Ler lista</button></div></details><div class="row">
<input type="date" value="${e.data}" onchange="up('data',this.value)">
<input placeholder="Local" value="${esc(e.local)}" onchange="up('local',this.value)">
<input placeholder="Tipo" value="${esc(e.tipo)}" onchange="up('tipo',this.value)">
<input type="number" min="1" title="Dias fora" value="${e.dias}" onchange="up('dias',Math.max(1,parseInt(this.value)||1))"></div>
<p class="mut">Registe quem consta na lista. Se souber de uma alteração, mude aqui o estado ou retire a pessoa (—). A app conta as nomeações, e não a presença efetiva.</p>
${[...S.people].sort((a,b)=>a.ordem-b.ordem).map(p=>`<div class="pl"><span>${esc(p.posto)} ${esc(p.nome)} <span class="mut">${esc(p.inst)}</span></span>
<select onchange="setS('${p.id}',this.value)"><option value="">—</option>${ES.map(s=>`<option ${st(p.id)===s?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||`<p class="mut">Adicione primeiro os efetivos.</p>`}
<div class="row" style="margin-top:10px"><button class="pri" onclick="edit=null;draw()">Concluir</button></div></div>`}
function up(k,v){S.events.find(x=>x.id===edit)[k]=v;save()}
function setS(p,s){const e=S.events.find(x=>x.id===edit);e.n=e.n.filter(x=>x.p!==p);if(s)e.n.push({p,s});save()}
function readList(){const t=$("#paste").value;if(!t.trim())return alert("Cole primeiro o texto da lista.");
const e=S.events.find(x=>x.id===edit),nz=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
const T=nz(t),L=t.split("\n").map(x=>x.trim()).filter(Boolean),M=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const m=T.match(/(\d{1,2})\s*(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\s*(\d{2,4})/);
if(m){const y=m[3].length===2?"20"+m[3]:m[3];e.data=y+"-"+String(M.indexOf(m[2])+1).padStart(2,"0")+"-"+m[1].padStart(2,"0");
const k=m[0].replace(/\s+/g,""),i=L.findIndex(l=>nz(l).replace(/\s+/g,"").includes(k)),loc=[];
if(i>=0){for(const l of L.slice(i+1)){if(/NA SALA|SAIDA|UNIFORME|CHEFIA|RESERVA/.test(nz(l)))break;if(/^\(/.test(l))continue;loc.push(l);if(loc.length==2)break}
if(loc.length)e.local=loc.join(" – ")}}
const r=T.indexOf("RESERVA"),rt=r>=0?T.slice(r,r+70):"",n=[];
S.people.forEach(p=>{const nn=nz(p.nome),byN=nn&&T.includes(nn),byO=(p.ordem&&new RegExp("(^|\\D)"+p.ordem+"(\\D|$)").test(T))||(p.adido&&L.some(l=>new RegExp("(^|\\D)"+p.adido+"(\\D|$)").test(l)&&/\d{6,8}/.test(l)));
if(!byN&&!byO)return;const isR=(nn&&rt.includes(nn))||L.some(l=>nz(l).includes(nn)&&/\sR\s*$/.test(nz(l)));n.push({p:p.id,s:isR?"Reserva":"Nomeado"})});
const um=L.filter(l=>/(^|\D)\d{6,8}(\D|$)/.test(l)&&!S.people.some(p=>nz(l).includes(nz(p.nome))||(p.ordem&&l.includes(p.ordem))));e.n=n;save();draw();alert(n.length?n.length+" pessoas reconhecidas ("+n.filter(x=>x.s==="Reserva").length+" em reserva). Confirme tudo antes de concluir."+(um.length?"\n\nLinhas com matrícula que não correspondem a ninguém do cadastro:\n"+um.slice(0,6).join("\n"):""):"Nenhuma pessoa reconhecida. Verifique se o cadastro está preenchido.")}
/* Equilíbrio */
function vEq(){const ev=S.events.filter(e=>(!fl.a||e.data>=fl.a)&&(!fl.b||e.data<=fl.b));
const r=S.people.map(p=>{let f=0,rs=0,dias=0;ev.forEach(e=>{const x=e.n.find(n=>n.p===p.id);if(!x)return;if(x.s==="Nomeado"){f++;dias+=e.dias}else if(x.s==="Reserva")rs++});return{p,f,rs,dias}}).sort((a,b)=>b.f-a.f||b.dias-a.dias);
const avg=r.length?r.reduce((s,x)=>s+x.f,0)/r.length:0,mx=Math.max(1,...r.map(x=>x.f));
const fl2=x=>{if(!avg)return"";const t=Math.max(1,avg*.25);return x.f>avg+t?`<span class="tag hi">acima</span>`:x.f<avg-t?`<span class="tag lo">abaixo</span>`:`<span class="tag ok">na média</span>`};
return `<div class="card"><h2>Período</h2><div class="row"><input type="date" value="${fl.a}" onchange="fl.a=this.value;draw()"><input type="date" value="${fl.b}" onchange="fl.b=this.value;draw()"><button onclick="fl={a:'',b:''};draw()">Limpar</button></div>
<p class="mut">${ev.length} cerimónias no período · média de ${avg.toFixed(1)} por pessoa. Alerta quando o desvio passa 25% da média (mínimo 1). Contam as nomeações que constam nas listas, não a presença efetiva.</p></div>
<div class="card"><div class="tw"><table><tr><th>Pessoa</th><th>Nomeações</th><th></th><th>Dias</th><th>Reserva</th><th>Estado</th></tr>
${r.map(x=>`<tr><td>${esc(x.p.posto)} ${esc(x.p.nome)} <span class="mut">${esc(x.p.inst)}</span></td><td>${x.f}</td><td><div class="bar"><i style="width:${x.f/mx*100}%"></i></div></td><td>${x.dias}</td><td>${x.rs}</td><td>${fl2(x)}</td></tr>`).join("")||`<tr><td class="mut">Sem dados.</td></tr>`}</table></div></div>`}
/* Backup */
function vBk(){return `<div class="card"><h2>Cópia de segurança</h2><p class="mut">Os dados ficam só neste dispositivo e navegador. Copie o texto abaixo e guarde-o num local seguro. Para restaurar, cole-o e carregue em Restaurar.</p>
<textarea id="bk">${esc(JSON.stringify(S))}</textarea>
<div class="row"><button class="pri" onclick="rest()">Restaurar</button><button class="del" onclick="wipe()">Apagar tudo</button></div></div>`}
function rest(){try{const d=JSON.parse($("#bk").value);if(!Array.isArray(d.people)||!Array.isArray(d.events))throw 0;S=d;mig();save();tab="eq";draw()}catch(e){alert("Texto inválido.")}}
function wipe(){if(confirm("Apagar todos os dados?")){S={people:[],events:[]};save();draw()}}
draw();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script></body></html>
